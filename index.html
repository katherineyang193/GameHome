<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f8f5ff" />
  <title>Katherine 遊戲屋</title>
  <meta name="description" content="可愛小遊戲集合，想玩哪個就出發！" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="background-decoration decoration-one"></div>
  <div class="background-decoration decoration-two"></div>

  <main class="page-shell">
    <header class="hero">
      <div class="hero-badge">🎮 GAME HOME</div>
      <h1>Katherine 遊戲屋</h1>
      <p>可愛小遊戲集合，想玩哪個就出發！ 🎈</p>
    </header>

    <section class="games-section" aria-labelledby="games-title">
      <div class="section-heading">
        <div>
          <span class="eyebrow">PLAY TIME</span>
          <h2 id="games-title">今天想玩什麼？</h2>
        </div>
        <span class="game-count" id="gameCount"></span>
      </div>

      <div class="game-grid" id="gameGrid" aria-live="polite"></div>
    </section>

    <footer>
      <span>Made for little happy moments ✨</span>
    </footer>
  </main>

  <template id="gameCardTemplate">
    <a class="game-card" target="_self">
      <div class="card-art" aria-hidden="true">
        <div class="card-icon"></div>
        <div class="sparkle sparkle-a">✦</div>
        <div class="sparkle sparkle-b">✧</div>
        <div class="sparkle sparkle-c">●</div>
      </div>
      <div class="card-content">
        <div class="card-topline">
          <span class="status-pill"></span>
          <span class="arrow">↗</span>
        </div>
        <h3></h3>
        <p></p>
        <span class="play-button">開始遊戲 <span>→</span></span>
      </div>
    </a>
  </template>

  <script src="app.js"></script>
</body>
</html>
